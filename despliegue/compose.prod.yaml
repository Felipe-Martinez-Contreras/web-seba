# Producción en una sola máquina de 1 GB (docs/DESPLIEGUE.md). Ningún servicio publica
# puertos: la única entrada es el túnel saliente de cloudflared.
# Se usa con el guion despliegue/vm/dc, que le pasa /etc/web-seba/compose.env.
name: web-seba

x-registros: &registros
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    # PostgreSQL 18.6, la misma imagen de desarrollo, fijada por digest.
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db_datos:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    mem_limit: 300m
    logging: *registros
    networks: [interna]

  web:
    image: ${WEB_SEBA_IMAGEN:-ghcr.io/felipe-martinez-contreras/web-seba}:${WEB_SEBA_VERSION:?}
    env_file: ${WEB_SEBA_ENTORNO:-/etc/web-seba/web.env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "docker/salud.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    restart: unless-stopped
    mem_limit: 450m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *registros
    networks: [interna]

  cloudflared:
    # cloudflared 2026.10.0, fijado por digest. No se actualiza solo: se cambia aquí.
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 96m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *registros
    networks:
      interna:
        # Dirección fija: es la única que la aplicación acepta como proxy de confianza
        # (PROXY_CONFIANZA_REDES=172.30.57.2/32 en web.env).
        ipv4_address: 172.30.57.2

networks:
  interna:
    ipam:
      config:
        - subnet: 172.30.57.0/28
          # Los demás contenedores reciben direcciones de este rango, que no incluye la del túnel.
          ip_range: 172.30.57.8/29

volumes:
  db_datos:
