{% load static %}<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="32x32">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'img/favicon-32.png' %}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preload" href="{% static 'fonts/inter-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="min-h-screen bg-fondo text-texto">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  {% block cuerpo %}{% endblock %}
</body>
</html>
