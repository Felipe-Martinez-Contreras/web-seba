{% load static %}<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="48x48">
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preload" href="{% static 'fonts/inter-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block htmx %}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
  {% endblock %}
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body class="min-h-screen bg-fondo text-texto"{% if csrf_token %} hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'{% endif %}>
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>
  {% block cuerpo %}{% endblock %}
</body>
</html>
