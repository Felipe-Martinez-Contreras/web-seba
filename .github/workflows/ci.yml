name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.24"

jobs:
  lint:
    name: Lint y formato
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pipx install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  pruebas:
    name: Pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: webseba
          POSTGRES_USER: webseba
          POSTGRES_PASSWORD: solo-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webseba -d webseba"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: clave-solo-para-la-ci-sin-valor-fuera-de-este-flujo-de-trabajo
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://webseba:solo-ci@localhost:5432/webseba
    steps:
      - uses: actions/checkout@v5
      - run: pipx install "uv==${UV_VERSION}"
      - run: uv sync --locked
      - name: Comprobaciones de Django
        run: uv run python manage.py check
      - name: Modelos sin migraciones pendientes
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Pruebas con cobertura
        run: uv run pytest

  auditoria:
    name: Vulnerabilidades de dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pipx install "uv==${UV_VERSION}"
      - name: Exportar el archivo de bloqueo
        run: uv export --locked --format requirements-txt --output-file requisitos.txt
      - name: pip-audit
        run: uvx pip-audit==2.10.1 --requirement requisitos.txt --require-hashes --disable-pip

  arranque:
    name: docker compose up desde cero
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Construir y levantar
        run: docker compose up --detach --build --wait --wait-timeout 300
      - name: La aplicación responde y llega a la base de datos
        run: curl --fail --silent --show-error http://localhost:8000/salud/
      - name: Las migraciones quedaron aplicadas en la base vacía
        run: docker compose exec -T web python manage.py migrate --check
      - name: Tailwind compiló el CSS con los tokens
        run: curl --fail --silent --show-error http://localhost:8000/static/css/app.css | grep --quiet --fixed-strings -e "--color-primario:"
      - name: Registros si algo falla
        if: failure()
        run: docker compose logs --no-color
      - name: Bajar
        if: always()
        run: docker compose down --volumes

  imagen:
    name: Imagen de producción
    runs-on: ubuntu-24.04
    needs: [lint, pruebas, auditoria, arranque]
    permissions:
      contents: read
      packages: write
    env:
      IMAGEN: ghcr.io/felipe-martinez-contreras/web-seba
      WEB_SEBA_VERSION: ${{ github.sha }}
      WEB_SEBA_ENTORNO: ${{ github.workspace }}/web.env
      WEB_SEBA_COMPOSE_ENV: ${{ github.workspace }}/compose.env
    steps:
      - uses: actions/checkout@v5
      - name: Construir la imagen de producción
        run: docker build --target prod --tag "$IMAGEN:$WEB_SEBA_VERSION" .
      - name: Entorno de prueba, sin secretos reales
        run: |
          cat > compose.env << 'FIN'
          POSTGRES_DB=webseba
          POSTGRES_USER=webseba
          POSTGRES_PASSWORD=solo-ci
          TUNNEL_TOKEN=sin-uso-en-la-ci
          FIN
          cat > web.env << 'FIN'
          SECRET_KEY=clave-solo-para-la-ci-de-la-imagen-de-produccion-sin-valor-fuera-de-aqui
          ALLOWED_HOSTS=staging.ejemplo.test
          SITIO_URL=https://staging.ejemplo.test
          DATABASE_URL=postgres://webseba:solo-ci@db:5432/webseba
          PROXY_CONFIANZA_REDES=172.30.57.2/32
          PROXY_CONFIANZA_ENCABEZADO=CF-Connecting-IP
          PROXY_HTTPS_ENCABEZADO=X-Forwarded-Proto
          DOCUMENTOS_ALMACENAMIENTO=local
          DOCUMENTOS_DIR=/tmp/documentos
          FIN
      # Sin el túnel: la CI no tiene, ni debe tener, su token.
      - name: Levantar la base y la aplicación como en el servidor
        run: |
          despliegue/vm/dc up --detach --wait db
          despliegue/vm/dc run --rm --no-deps web python manage.py preparar_despliegue
          despliegue/vm/dc up --detach --wait --wait-timeout 180 db web
      - name: Responde por Gunicorn y llega a la base de datos
        run: |
          despliegue/vm/dc exec -T web python -I -S docker/salud.py
          despliegue/vm/dc exec -T web python -I -S docker/salud.py /salud/ / /acceso/
      - name: Sin notificaciones pendientes, la tarea de reintentos no carga la aplicación
        run: |
          despliegue/vm/tarea.sh reintentar_notificaciones | tee tarea.txt
          grep --quiet --fixed-strings "Notificaciones por reintentar: 0" tarea.txt
          test "$(wc -l < tarea.txt)" = "1"
      - name: HEAD responde 200 y sin cuerpo, por Gunicorn
        run: |
          despliegue/vm/dc exec -T web python docker/head.py /salud/
          despliegue/vm/dc exec -T web python docker/head.py /
      - name: Sirve los estáticos recolectados, con nombre con hash
        run: |
          ruta="$(despliegue/vm/dc exec -T web python -c "import json; print('/static/' + json.load(open('staticfiles/staticfiles.json'))['paths']['css/app.css'])")"
          echo "$ruta" | grep --quiet --extended-regexp '^/static/css/app\.[0-9a-f]+\.css$'
          despliegue/vm/dc exec -T web python -I -S docker/salud.py "$ruta" > /dev/null
          despliegue/vm/dc exec -T web grep --quiet --fixed-strings -e "--color-primario:" "staticfiles${ruta#/static}"
      - name: check --deploy con la configuración de producción
        run: despliegue/vm/dc exec -T web python manage.py check --deploy
      - name: La aplicación no corre como root y no publica puertos
        run: |
          test "$(despliegue/vm/dc exec -T web id -u)" = "1000"
          test -z "$(docker ps --filter name=web-seba --format '{{.Ports}}' | grep --fixed-strings -e '->' || true)"
      - name: Los logs de Gunicorn salen en JSON
        run: |
          despliegue/vm/dc logs --no-log-prefix web > registros.txt
          grep --max-count 3 --fixed-strings '"origen": "gunicorn.access"' registros.txt
      - name: Registros si algo falla
        if: failure()
        run: despliegue/vm/dc logs --no-color
      - name: Publicar en el registro de GitHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGEN:$WEB_SEBA_VERSION"
      - name: Bajar
        if: always()
        run: despliegue/vm/dc down --volumes
